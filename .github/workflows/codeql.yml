name: CodeQL

# Default setup は Linux ランナーで Go を解析するため、Windows 専用パッケージ
# （golang.org/x/sys/windows/registry 等）が import できず解析が不完全になる。
# Advanced setup に切り替え、Go のみ Windows ランナーで手動ビルドして解析する。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 18 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
            runner: windows-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7.0.0
        if: matrix.language == 'go'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # main.go が //go:embed all:frontend/dist を参照するため、Go のビルド前にフロントエンドをビルドする
      - name: Build frontend
        if: matrix.language == 'go'
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build Go
        if: matrix.language == 'go'
        run: go build ./...

      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}
